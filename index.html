<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
GLOBAL INTERNET INFRASTRUCTURE ATLAS
</title>


<link rel="stylesheet" href="css/style.css">

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="js/colors.js"></script>    
<script src="js/physics.js"></script>
<script src="js/app.js"></script>

</head>


<body>



<!-- =====================================
     COMMAND HEADER
===================================== -->


<header class="command-header">


<div class="brand">


<h1>
GLOBAL INTERNET INFRASTRUCTURE ATLAS
</h1>


<p>
GNIP (GLOBAL NETWORK INTELLIGENCE PLATFORM)
</p>


</div>



<div class="system-status">


<div class="indicator"></div>


<span>
SYSTEM ONLINE
</span>


</div>



</header>





<!-- =====================================
     CONTROL BAR
===================================== -->


<section class="control-panel">


<div class="search-box">


<input 

id="search"

placeholder="SEARCH INFRASTRUCTURE ENTITY..."

>


</div>




<div class="filters">


<button onclick="filterLayer('all')">
ALL
</button>


<button onclick="filterLayer('cloud')">
CLOUD
</button>


<button onclick="filterLayer('backbone')">
BACKBONE
</button>


<button onclick="filterLayer('carrier')">
CARRIERS
</button>


<button onclick="filterLayer('ixp')">
IXP
</button>

<button onclick="filterLayer('dns')">
DNS
</button>


<button onclick="filterLayer('satellite')">
SATELLITE
</button>

<button onclick="filterLayer('submarine')">
SUBSEA
</button>


<button onclick="resetView()">
RESET VIEW
</button>



</div>



</section>








<!-- =====================================
     MAIN OPERATIONS AREA
===================================== -->


<main>



<!-- NETWORK VISUALIZATION -->

<section 
id="network"
>


</section>






<!-- =====================================
     INTELLIGENCE PANEL
===================================== -->


<aside id="panel">


<h2>
INFRASTRUCTURE INTELLIGENCE
</h2>



<div id="stats">


<div>
LOADING DATABASE...
</div>


</div>





<div id="details">


SELECT NETWORK NODE


</div>



</aside>




</main>






<!-- =====================================
     FOOTER STATUS
===================================== -->


<footer>


<div>

DATABASE:
GLOBAL INTERNET INFRASTRUCTURE MODEL

</div>



<div>

MODE:
NETWORK GRAPH ANALYSIS

</div>



<div>

VERSION:
ATLAS-01

</div>


</footer>






<script src="js/app.js"></script>


</body>


</html>
